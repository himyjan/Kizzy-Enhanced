[versions]
# project level
gradle = "9.6.0-alpha02"
kotlin = "2.4.21"
ksp = "2.3.13"
version-name = "6.2-enhanced-0"
version-code = "14"

# app level
activity-compose = "1.13.0"
androidx-material = "1.14.0"
app-compat = "1.8.0"
coil = "3.6.3"
compose-bom = "2023.06.00"
compose-navigation = "2.10.2"
core-ktx = "1.19.1"
crashx = "v6.0.19"
datastore-preferences = "1.3.0"
hilt = "2.60.1"
imgur-api-base-url = "https://api.imgur.com/3"
hiltWork = "1.4.0"
ktor = "3.6.1"
kotlinx-coroutine = "1.11.0"
lifecycle-ktx = "2.11.0"
mmkv = "2.4.3"
junit = "4.13.2"
guava-listenablefuture = "9999.0-empty-to-avoid-conflict-with-guava"
concurrent-futures-ktx = "1.3.0"
jakarta-inject = "2.0.1"
javax = "1"
kotlinx-serialization-json = "1.12.0"
tink-android = "1.24.0"
hilt-navigation-compose = "1.4.0"
workmanager = "2.12.0"

[libraries]
# Jakarta
jakarta-inject = { module = "jakarta.inject:jakarta.inject-api", version.ref = "jakarta-inject" }
javax = { module = "javax.inject:javax.inject", version.ref = "javax" }

# Androidx
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
app-compat = { module = "androidx.appcompat:appcompat", version.ref = "app-compat" }
androidx-material = { module = "com.google.android.material:material", version.ref = "androidx-material" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }
kotlinx-coroutine = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutine" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "compose-navigation" }

# Compose BOM (manages all androidx.compose.* versions)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }

# Material3 — version from BOM
material3 = { module = "androidx.compose.material3:material3" }
material3-windows-size = { module = "androidx.compose.material3:material3-window-size-class" }

# Compose — versions from BOM
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }

# Hilt
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Gradle plugins
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

# Ktor (v3.x)
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-kotlinx-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# Third-party libraries
crashx = { module = "com.github.TutorialsAndroid:crashx", version.ref = "crashx" }
mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
guava-listenablefuture = { module = "com.google.guava:listenablefuture", version.ref = "guava-listenablefuture" }
concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrent-futures-ktx" }

# KotlinX
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink-android" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltWork" }

[plugins]
android-application = { id = "com.android.application", version.ref = "gradle" }
android-library = { id = "com.android.library", version.ref = "gradle" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
network-ktor = ["ktor-core", "ktor-client-cio", "ktor-kotlinx-serialization"]
secure-storage = ["datastore-preferences", "tink-android"]