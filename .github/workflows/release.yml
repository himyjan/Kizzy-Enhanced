name: Build Release Apk

on:
  workflow_dispatch:
    inputs:
      notes_en:
        description: "What's new"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Release Apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: gradle

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias kizzyfork \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kizzyfork -keypass kizzyfork \
            -dname "CN=Kizzy Fork, OU=Fork, O=Kizzy, L=NA, S=NA, C=NA"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set version
        run: |
          sed -i 's/version-name = ".*"/version-name = "6.2-enhanced-${{ github.run_number }}"/' gradle/libs.versions.toml
          sed -i 's/version-code = ".*"/version-code = "${{ github.run_number }}"/' gradle/libs.versions.toml

      - name: Update app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          SRC="kizzy-fork-icon.png"
          convert "$SRC" -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$SRC" -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$SRC" -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$SRC" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$SRC" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "$SRC" -resize 108x108 app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 162x162 app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 216x216 app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 324x324 app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 432x432 app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          convert -size 108x108 xc:"#BF1527" app/src/main/res/mipmap-mdpi/ic_launcher_background.png
          convert -size 162x162 xc:"#BF1527" app/src/main/res/mipmap-hdpi/ic_launcher_background.png
          convert -size 216x216 xc:"#BF1527" app/src/main/res/mipmap-xhdpi/ic_launcher_background.png
          convert -size 324x324 xc:"#BF1527" app/src/main/res/mipmap-xxhdpi/ic_launcher_background.png
          convert -size 432x432 xc:"#BF1527" app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          convert "$SRC" -resize 108x108 -colorspace gray app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 162x162 -colorspace gray app/src/main/res/mipmap-hdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 216x216 -colorspace gray app/src/main/res/mipmap-xhdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 324x324 -colorspace gray app/src/main/res/mipmap-xxhdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 432x432 -colorspace gray app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png

      - name: Assemble Release APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: kizzyfork
          KEY_ALIAS: kizzyfork
          KEY_PASSWORD: kizzyfork
        run: ./gradlew clean :data:kspReleaseKotlin :feature_rpc_base:kspReleaseKotlin :app:assembleRelease :app:bundleRelease

      - name: Rename Base APK and App Bundle
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab

      - name: Download bundletool
        run: |
          curl -L "https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar" -o "$RUNNER_TEMP/bundletool.jar"

      - name: Extract Universal & Per-ABI APKs from App Bundle
        run: |
          AAB="app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab"
          OUT_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/release"

          # 1. Extract Universal APK
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" \
            --output="$RUNNER_TEMP/universal.apks" \
            --ks="$RUNNER_TEMP/release.keystore" \
            --ks-pass=pass:kizzyfork \
            --ks-key-alias=kizzyfork \
            --key-pass=pass:kizzyfork \
            --mode=universal
          unzip -o -q "$RUNNER_TEMP/universal.apks" "universal.apk" -d "$RUNNER_TEMP/out-universal"
          cp "$RUNNER_TEMP/out-universal/universal.apk" "$OUT_DIR/KizzyEnhanced-${{ github.run_number }}-universal.apk"

          # 2. Extract standalone APKs per ABI (arm64-v8a, armeabi-v7a, x86_64)
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cat > "$RUNNER_TEMP/spec-${ABI}.json" <<EOF
          {
            "supportedAbis": ["${ABI}"],
            "supportedLocales": ["en"],
            "screenDensity": 480,
            "sdkVersion": 37
          }
          EOF
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
              --bundle="$AAB" \
              --output="$RUNNER_TEMP/${ABI}.apks" \
              --device-spec="$RUNNER_TEMP/spec-${ABI}.json" \
              --ks="$RUNNER_TEMP/release.keystore" \
              --ks-pass=pass:kizzyfork \
              --ks-key-alias=kizzyfork \
              --key-pass=pass:kizzyfork \
              --mode=universal
            unzip -o -q "$RUNNER_TEMP/${ABI}.apks" "universal.apk" -d "$RUNNER_TEMP/out-${ABI}"
            cp "$RUNNER_TEMP/out-${ABI}/universal.apk" "$OUT_DIR/KizzyEnhanced-${{ github.run_number }}-${ABI}.apk"
          done

      - name: Upload All Release APKs
        uses: actions/upload-artifact@v6
        with:
          name: apks-release
          path: app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab

      - name: Generate categorized git changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="-n 100"
          fi

          RAW_COMMITS=$(git log $RANGE --pretty=format:"%s (%h)" --no-merges | rg -iv '^(chore|ci|style|build|test)(\(.+\))?:' || true)

          FEATS=$(printf '%s\n' "$RAW_COMMITS" | rg -i '^feat(\(.+\))?:' | sed -E 's/^feat(\(([^)]+)\))?:\s*/- **\2**: /I; s/^\- \*\*\*\*: /- /' || true)
          FIXES=$(printf '%s\n' "$RAW_COMMITS" | rg -i '^fix(\(.+\))?:' | sed -E 's/^fix(\(([^)]+)\))?:\s*/- **\2**: /I; s/^\- \*\*\*\*: /- /' || true)
          PERFS=$(printf '%s\n' "$RAW_COMMITS" | rg -i '^(perf|refactor)(\(.+\))?:' | sed -E 's/^(perf|refactor)(\(([^)]+)\))?:\s*/- **\3**: /I; s/^\- \*\*\*\*: /- /' || true)
          OTHERS=$(printf '%s\n' "$RAW_COMMITS" | rg -iv '^(feat|fix|perf|refactor)(\(.+\))?:' | sed 's/^/- /' || true)

          {
            echo "body<<EOF"
            if [ -n "$FEATS" ]; then
              echo "### ✨ Features"
              printf '%s\n\n' "$FEATS"
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              printf '%s\n\n' "$FIXES"
            fi
            if [ -n "$PERFS" ]; then
              echo "### ⚡ Performance & Refactoring"
              printf '%s\n\n' "$PERFS"
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 📦 Other Changes"
              printf '%s\n\n' "$OTHERS"
            fi
            if [ -z "$RAW_COMMITS" ]; then
              echo "_No code changes recorded since last tag._"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release asset table & checksums
        id: assets
        run: |
          {
            echo "table<<EOF"
            echo "| File | Architecture / Type | Size | SHA-256 |"
            echo "| :--- | :--- | :--- | :--- |"
            for FILE in \
              "app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-arm64-v8a.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-armeabi-v7a.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-x86_64.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-universal.apk" \
              "app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab"
            do
              NAME=$(basename "$FILE")
              SIZE=$(du -h "$FILE" | cut -f1)
              HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
              case "$NAME" in
                *arm64-v8a*) ARCH="ARM64 (Recommended for modern phones)" ;;
                *armeabi-v7a*) ARCH="ARM32 (Older Android devices)" ;;
                *x86_64*) ARCH="x86_64 (Emulators & Chromebooks)" ;;
                *universal*) ARCH="Universal (All architectures)" ;;
                *.aab*) ARCH="Android App Bundle (Play Store / bundletool)" ;;
              esac
              echo "| \`$NAME\` | $ARCH | $SIZE | \`$HASH\` |"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: enhanced-${{ github.run_number }}
          name: Kizzy Enhanced ${{ github.run_number }}
          body: |
            ## 🚀 Kizzy Enhanced ${{ github.run_number }}

            ${{ github.event.inputs.notes_en != '' && github.event.inputs.notes_en || 'No release notes provided.' }}

            ---
            ## 📦 Downloads

            | File | Architecture / Type | Size | SHA-256 |
            | :--- | :--- | :--- | :--- |
            ${{ steps.assets.outputs.table }}

            ---
            ## 📋 Changelog
            ${{ steps.changelog.outputs.body }}

            ---
            ## 📊 Release Summary

            | Field | Value |
            | :--- | :--- |
            | Package | `com.my.kizzy.enhanced` |
            | Version | `6.2-enhanced-${{ github.run_number }}` |
            | Version Code | `${{ github.run_number }}` |
            | Base Project | Kizzy by dead8309 |
            | Base Commit | \`5e494d94a2c05e4d56b75ac80aae51dba4436905\` |
            | Full Feature List | See the README |
            | Compare to Base | [dead8309/Kizzy → master](https://github.com/dead8309/Kizzy/compare/c59f81b43e9b6ae9c14dd8926a4d5753fb6eedd9...master) |

            ---
            ## 📲 Installation

            1. Download **KizzyEnhanced-${{ github.run_number }}-arm64-v8a.apk** (or `universal.apk` if you are unsure of your device's CPU).
            2. Open the APK file on your Android device.
            3. If prompted, allow **"Install from unknown sources"**.
            4. If upgrading from an older build signed with a different key, uninstall the previous version first (export your RPC configs beforehand).

            ---
            <details>
            <summary>🔧 Build & Dependency Changes (Click to expand)</summary>

            | Component | Base Commit | This Fork | Change Type |
            | :--- | :--- | :--- | :--- |
            | Gradle | 8.13.2 | 9.9.1 | Major upgrade |
            | AGP | 8.13.2 | 9.6.0-alpha03 | Major upgrade |
            | Kotlin | 2.1.20 | 2.4.21 | Major upgrade |
            | KSP | 2.1.20-1.0.31 | 2.3.13 | Major upgrade |
            | Compose BOM | 2025.06.01 | 2026.09.00-alpha01 | ~1.5 years newer |
            | Ktor | 2.3.0 | 3.6.1 | Major upgrade |
            | Coil | 2.1.0 | 3.6.3 (Coil3) | Major rewrite |
            | Hilt | 2.56.2 | 2.60.1 | Minor upgrade |
            | Material | 1.12.0 | 1.14.0 | Minor upgrade |

            **Removed:** MMKV, Accompanist, BlankJ UtilCodex, CrashX, AndroidSVG, javax.inject  
            **Added:** Jetpack DataStore 1.3.0, Tink Android 1.24.0, Jetpack BaselineProfile 1.6.0-alpha01, Jetpack MacroBenchmark 1.6.0-alpha01, Coil 3.6.3, WorkManager 2.12.0, Hilt Work 1.4.0, Material3 Adaptive 1.4.0-alpha03  
            **Critical:** Coil 3 splits the HTTP fetcher — `coil-network-ktor3` was added; without it, remote images fail to load.

            **HTTP Client:** CIO client replaced with OkHttp client via `ktor-client-okhttp` across all RPC services for better mobile reliability (connection pooling, HTTP/2 multiplexing, Wi-Fi/cellular handoff, robust SSL/TLS).
            </details>

            ---
            <details>
            <summary>🎮 Console RPC → Custom RPC Merge</summary>

            **Before:** Separate Console RPC screen, home entry, and navigation route  
            **After:** Single Custom RPC screen with two tabs

            **Console RPC Tab:**
            - Platform: Desktop, Web, Android, iOS, Xbox, PlayStation, VR
            - Activity Type: Playing, Streaming, Listening, Watching, Competing
            - Status: Online, Idle, DND, Offline, Invisible
            - Enable Timestamps / Show Cover Art toggles
            - Button 1/2: Text + URL
            - Preset Games: Xbox, PlayStation, Nintendo, Desktop quick-select chips

            **Features:** Console presets with custom preset creation and deletion support
            </details>

            ---
            <details>
            <summary>🔐 DataStore Migration (MMKV → Jetpack DataStore)</summary>

            **Before:** MMKV (C++ based, synchronous, no coroutine integration)  
            **After:** Jetpack DataStore Preferences 1.3.0

            **Architecture:** `MutableStateFlow<Map<String, Any?>>` mirror for synchronous reads; async writes on `Dispatchers.IO`.  
            **Typed Keys:** `stringPreferencesKey`, `intPreferencesKey`, `booleanPreferencesKey`, `floatPreferencesKey`, `longPreferencesKey`  
            **Remove:** Deletes key under all five typed keys  
            **Edit:** `MutablePreferences` receiver (`Preferences.() -> Unit`)
            </details>

            ---
            <details>
            <summary>🔒 Tink AES-256-GCM Token Encryption</summary>

            **Sensitive keys encrypted:** `TOKEN`, `DISCORD_OAUTH_ACCESS_TOKEN`, `DISCORD_OAUTH_REFRESH_TOKEN`  
            **Key storage:** Android Keystore via `AndroidKeysetManager`  
            **Ciphertext:** `enc:` + Base64(NO_WRAP) — pre-existing plaintext tokens remain readable  
            **Fallback:** If keystore unavailable, falls back to plain text (user never locked out)
            </details>

            ---
            <details>
            <summary>🔐 Discord OAuth2 Integration (New Feature)</summary>

            **Files added:** `DiscordAuth.kt`, `DiscordOAuthActivity.kt`, `DiscordUserLoginDialog.kt`, `DiscordOAuthRpcService.kt`  
            **OAuth2 flow:** User authorizes via Discord → app exchanges code for token → stored encrypted via Tink  
            **Per-user OAuth:** Users can use their own Discord account instead of bot token
            </details>

            ---
            <details>
            <summary>📱 Media RPC Activity Type Fix</summary>

            **Bug:** Global activity type setting did not take effect for known apps (YouTube Music, Spotify, etc.) because built-in catalog was checked before global fallback.  
            **Fix:** When user explicitly sets a global activity type (not "Auto"), built-in catalog and metadata detection are skipped; per-app overrides still win.
            </details>

            ---
            <details>
            <summary>🎨 Cover Art Settings (New Feature)</summary>

            **Global Toggle:** Hide Cover Art Images — when enabled, hides cover art from ALL RPC types (Media, Custom, Console, Experimental); Discord shows text only.

            **Default Cover Art URLs:** Set default large and small cover art image URLs. When a notification has no cover art, the default image is used as fallback instead of Discord's default app icon.

            **Applied to:** Media RPC, Custom RPC (Console tab), Experimental RPC.
            </details>

            ---
            <details>
            <summary>🔗 YouTube Music Link Fix</summary>

            **Bug:** YouTube Music activity link pointed to a search page URL (e.g. `youtube.com/results?search_query=...`) instead of the actual video.  
            **Fix:** `getMediaUrl()` now returns `null` when `extractYouTubeUrl()` returns null for YouTube apps, instead of falling back to `mediaSearchUrl()` which returns another search page. Discord now shows the direct `youtu.be/VIDEO_ID` link instead of a broken search page.
            </details>

            ---
            <details>
            <summary>🎮 Experimental RPC: Select All / Deselect All</summary>

            Two buttons added above the app list for bulk enabling/disabling all apps at once.
            </details>

            ---
            <details>
            <summary>🌍 i18n — All 87 Locale Files</summary>

            **0 English leftovers** across all locales  
            **0 cross-script contamination**  
            All 88 strings.xml files valid XML; `:app:mergeDebugResources` verified BUILD SUCCESSFUL  
            Brand names (Xbox, PlayStation, Nintendo, iOS, VR) intentionally identical across locales
            </details>

            ---
            <details>
            <summary>📏 APK Size Reduction</summary>

            **Release: 35 MB → 8.2 MB (77% smaller)**  
            **DEX files:** 29 → 1  
            **R8:** 769 classes removed, 14 app classes, 171 obfuscated, 0 kept names  
            **ABI Filters:** `arm64-v8a`, `x86_64` (32-bit devices excluded)
            </details>

            ---
            <details>
            <summary>⚖️ Pros & Cons</summary>

            **✅ Pros:**
            - Tink AES-256-GCM + Android Keystore for token encryption at rest
            - Jetpack DataStore replaces MMKV (Jetpack-first, coroutine-friendly)
            - Console RPC merged into Custom RPC (single screen, less navigation)
            - Discord OAuth2 support (use your own Discord account)
            - Modern toolchain (Kotlin 2.4.21, Gradle 9.9.1)
            - Release APK only 8.2 MB
            - All 87 locales fully translated (0 English leftovers)
            - Proper AAB CI/CD workflow via bundletool

            **❌ Cons / Limitations:**
            - Kotlin 2.4.21 and Compose BOM 2026.09-alpha are pre-release channels
            - ABI filtering excludes 32-bit ARM/x86 devices
            - Console RPC merged into Custom RPC (extra tap to access console settings)
            - OAuth2 requires user's own Discord Application ID
            - No OAuth2 token refresh logic implemented yet
            - Client ID stored in plaintext (not encrypted)
            </details>

            ---
            <details>
            <summary>📁 Key Files Changed</summary>

            **New:** `DiscordAuth.kt`, `DiscordOAuthActivity.kt`, `DiscordUserLoginDialog.kt`, `DiscordOAuthRpcService.kt`, `ConsolePresetEditor.kt`, `ConsolePresets.kt`  
            **Deleted:** `GamesScreen.kt` (merged into Custom RPC)  
            **Major changes:** `CustomRpc.kt` (+1,398 lines), `MediaRpcService.kt` (+945), `ExperimentalRpc.kt` (+669), `RpcSettings.kt` (+336), `MetadataResolver.kt` (cover art URLs + YouTube link fix)  
            **Locale files:** 87 updated  
            **Build files:** `gradle/libs.versions.toml` (ktor-client-okhttp added), `release.yml`, 30+ module `build.gradle.kts` files
            </details>

            ---
            <details>
            <summary>🚀 Gateway / WebSocket</summary>

            New gateway module with Discord gateway entities: `Activity.kt`, `Assets.kt`, `Identify.kt`, `HeartBeat.kt`, `Payload.kt`, `Ready.kt`, `Resume.kt`, `OpCode.kt`, `Presence.kt`, `Timestamps.kt`
            </details>
          files: |
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-arm64-v8a.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-armeabi-v7a.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-x86_64.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-universal.apk
            app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}