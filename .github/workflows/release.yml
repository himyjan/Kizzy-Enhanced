            - NetEase Cloud Music: `music.163.com/#/song?id={id}`, `/#/album?id={id}`, `/#/artist?id={id}`, `/#/playlist?id={id}`
            - Kuwo Music: `/play_detail/{id}`, `/album_detail/{id}`, `/singer_detail/{id}`, `/playlist_detail/{id}`

            **Indian Platforms:**
            - JioSaavn: `/{slug}/{token}` (track/album/artist/playlist)
            - Gaana: `/{slug}` (track/album/artist/playlist)
            - Wynk Music: `/music/song/{slug}/{id}`, `/music/album/{slug}/{id}`, `/music/artist/{slug}/{id}`, `/music/playlist/{slug}/{id}`

