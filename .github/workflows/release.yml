name: Build Release Apk

on:
  workflow_dispatch:
    inputs:
      notes_en:
        description: "What's new"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Release Apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: gradle

      - name: Decode release signing keystore from secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update version metadata
        run: |
          sed -i 's/version-name = ".*"/version-name = "6.2-enhanced-${{ github.run_number }}"/' gradle/libs.versions.toml
          sed -i 's/version-code = ".*"/version-code = "${{ github.run_number }}"/' gradle/libs.versions.toml

      - name: Update app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          SRC="kizzy-fork-icon.png"
          convert "$SRC" -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$SRC" -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$SRC" -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$SRC" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$SRC" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "$SRC" -resize 108x108 app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 162x162 app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 216x216 app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 324x324 app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 432x432 app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          convert -size 108x108 xc:"#BF1527" app/src/main/res/mipmap-mdpi/ic_launcher_background.png
          convert -size 162x162 xc:"#BF1527" app/src/main/res/mipmap-hdpi/ic_launcher_background.png
          convert -size 216x216 xc:"#BF1527" app/src/main/res/mipmap-xhdpi/ic_launcher_background.png
          convert -size 324x324 xc:"#BF1527" app/src/main/res/mipmap-xxhdpi/ic_launcher_background.png
          convert -size 432x432 xc:"#BF1527" app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          convert "$SRC" -resize 108x108 -colorspace gray app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 162x162 -colorspace gray app/src/main/res/mipmap-hdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 216x216 -colorspace gray app/src/main/res/mipmap-xhdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 324x324 -colorspace gray app/src/main/res/mipmap-xxhdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 432x432 -colorspace gray app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png

      - name: Assemble Release APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: kizzyfork
          KEY_ALIAS: kizzyfork
          KEY_PASSWORD: kizzyfork
        run: ./gradlew --no-daemon --max-workers=2 clean :data:kspReleaseKotlin :feature_rpc_base:kspReleaseKotlin :app:assembleRelease :app:bundleRelease

      - name: Analyze R8 Configuration
        run: ./gradlew :app:analyzeReleaseR8Config

      - name: Download bundletool
        run: |
          curl -L "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" -o "$RUNNER_TEMP/bundletool.jar"

      - name: Generate Split APKs for All Device Targets from App Bundle
        env:
          KEYSTORE_PASSWORD: kizzyfork
          KEY_ALIAS: kizzyfork
          KEY_PASSWORD: kizzyfork
        run: |
          # Rename app-release.aab to KizzyEnhanced-${{ github.run_number }}.aab
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            mv "app/build/outputs/bundle/release/app-release.aab" "app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab"
          fi

          AAB="app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab"
          OUT_DIR="app/build/outputs/apk/release"
          RUN="${{ github.run_number }}"

          # Generate split APKs for all targets (all ABIs, densities, languages) from the .aab
          # Using --mode=default creates the complete matrix of split APKs inside app.apks
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" \
            --output="$RUNNER_TEMP/app.apks" \
            --ks="$RUNNER_TEMP/release.keystore" \
            --ks-pass=pass:${KEYSTORE_PASSWORD} \
            --ks-key-alias=${KEY_ALIAS} \
            --key-pass=pass:${KEY_PASSWORD} \
            --mode=default

          # Extract all generated split APKs
          mkdir -p "$RUNNER_TEMP/splits"
          unzip -o -q "$RUNNER_TEMP/app.apks" -d "$RUNNER_TEMP/splits"

          # Copy base APK (universal - works on all devices)
          cp "$RUNNER_TEMP/splits/splits/base-master.apk" "$OUT_DIR/KizzyEnhanced-${RUN}-universal.apk"

          # Copy per-ABI split APKs
          for ABI_APK in "$RUNNER_TEMP/splits/splits"/base-*-*.apk; do
            [ -f "$ABI_APK" ] || continue
            ABI_NAME=$(basename "$ABI_APK" .apk | sed 's/base-//; s/.apk//')
            cp "$ABI_APK" "$OUT_DIR/KizzyEnhanced-${RUN}-${ABI_NAME}.apk"
          done

          echo "=== Generated APKs ==="
          ls -la "$OUT_DIR/KizzyEnhanced-${RUN}-"*.apk

      - name: Generate Performance Reports
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/reports"
          find app/build/outputs/mapping/release -name "mapping.txt" -o -name "usage.txt" 2>/dev/null | while read f; do
            echo "R8 Report: $f"
            cp "$f" "$GITHUB_WORKSPACE/build/reports/r8-$(basename "$f")" 2>/dev/null || true
          done
          ./gradlew :app:problemsRelease --no-daemon 2>/dev/null || true
          if [ -f "build/reports/problems/problems-report.html" ]; then
            cp build/reports/problems/problems-report.html build/reports/problems-release.html
          fi

      - name: Generate changelog
        run: chmod +x .github/scripts/generate-changelog.sh && .github/scripts/generate-changelog.sh

      - name: Generate Release Notes Body
        id: release_notes
        run: |
          {
            echo "| File | Architecture / Type | Size | SHA-256 |"
            echo "| :--- | :--- | :--- | :--- |"
            RUN="${{ github.run_number }}"
            for FILE in \
              "app/build/outputs/apk/release/KizzyEnhanced-${RUN}-arm64-v8a.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${RUN}-x86_64.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${RUN}-universal.apk" \
              "app/build/outputs/bundle/release/KizzyEnhanced-${RUN}.aab"
            do
              [ -f "$FILE" ] || continue
              NAME=$(basename "$FILE")
              SIZE=$(du -h "$FILE" | cut -f1)
              HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
              case "$NAME" in
                *arm64-v8a*) ARCH="ARM64 (Recommended for modern phones)" ;;
                *x86_64*) ARCH="x86_64 (Emulators & Chromebooks)" ;;
                *universal*) ARCH="Universal (All architectures)" ;;
                *.aab*) ARCH="Android App Bundle (Play Store / bundletool)" ;;
              esac
              printf '| `%s` | %s | %s | `%s` |\n' "$NAME" "$ARCH" "$SIZE" "$HASH"
            done
          } > download-table.md

          NOTES="${{ github.event.inputs.notes_en }}"
          if [ -z "$NOTES" ]; then
            NOTES=$(cat changelog.md)
          fi

          {
            printf '## 🚀 Kizzy Enhanced %s\n\n' "${{ github.run_number }}"
            printf '%s\n\n' "$NOTES"
            printf -- '---\n\n'
            printf '## 📦 Downloads\n\n'
            cat download-table.md
            printf '\n---\n\n'
            printf '## 📊 R8 Configuration Analysis Report\n\n'
            printf 'The R8 optimization analysis report has been generated and is available as a release asset below.\n'
            printf 'Download the HTML report to review R8 configuration analysis results including kept/removed classes, obfuscation stats, and optimization recommendations.\n\n'
            printf -- '---\n\n'
            cat changelog.md
            printf '\n---\n\n'
            printf '## 📊 Release Summary\n\n'
            printf '| Field | Value |\n'
            printf '| :--- | :--- |\n'
            printf '| Package | `com.my.kizzy.enhanced` |\n'
            printf '| Version | `6.2-enhanced-%s` |\n' "${{ github.run_number }}"
            printf '| Version Code | `%s` |\n' "${{ github.run_number }}"
            printf '| Base Project | Kizzy by dead8309 |\n'
            printf '| Base Commit | `5e494d94a2c05e4d56b75ac80aae51dba4436905` |\n'
            printf '| Full Feature List | [docs/RELEASE_FEATURES.md](docs/RELEASE_FEATURES.md) |\n'
            printf '| Compare to Base | [himyjan/Kizzy-Enhanced → master](https://github.com/himyjan/Kizzy-Enhanced/compare/ac7338da99ba2f4b95fa588d9b1cfd0ecfc4b919...master) |\n\n'
            printf -- '---\n\n'
            printf '## 📲 Installation\n\n'
            printf '1. Download **KizzyEnhanced-%s-arm64-v8a.apk** (or `universal.apk` if you are unsure of your device'\''s CPU).\n' "${{ github.run_number }}"
            printf '2. Open the APK file on your Android device.\n'
            printf '3. If prompted, allow "Install from unknown sources".\n'
            printf '4. If upgrading from an older build signed with a different key, uninstall the previous version first (export your RPC configs beforehand).\n\n'
            printf -- '---\n\n'
            printf '## 📖 Full Feature History\n\n'
            printf 'See [docs/RELEASE_FEATURES.md](docs/RELEASE_FEATURES.md) for the complete list of features, bug fixes, and dependency changes.\n\n'
          } > release-notes.md

      - name: Upload All Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks-release
          path: app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: |
            build/reports/r8-*.txt
            build/reports/problems-release.html
            build/reports/build_reports_*/
            app/build/reports/r8/**
            app/build/reports/r8/r8-config-analyzer-release.pb
          retention-days: 30

      - name: Upload Changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md

      - name: Publish to Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: enhanced-${{ github.run_number }}
          name: Kizzy Enhanced ${{ github.run_number }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-universal.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-arm64_v8a.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-armeabi_v7a.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-x86.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-x86_64.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-mdpi.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-hdpi.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-xhdpi.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-xxhdpi.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-xxxhdpi.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-en.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base-zh.apk
            app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab
            app/build/reports/r8/**/*.html
            app/build/reports/r8/**/*.json
            app/build/reports/r8/**/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}