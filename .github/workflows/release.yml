            - Amazon Music: `/{asin}/{slug}` (track/album/playlist)
            - YouTube Music: `/watch?v={ID}` → `youtu.be/{ID}`, `/channel/{ID}`, `/playlist?list={ID}`
            - Deezer: `/track/{id}`, `/album/{id}`, `/playlist/{id}`, `/artist/{id}`
            - TIDAL: `/track/{id}`, `/album/{id}`, `/playlist/{id}`, `/artist/{id}`
            - KKBOX: `/song/{id}`, `/album/{id}`, `/playlist/{id}`, `/artist/{id}`
            - LINE MUSIC (JP/TW): `/track/{id}`, `/album/{id}`, `/playlist/{id}`, `/artist/{id}`
            - JOOX: `/single/{id}`, `/album/{id}`, `/playlist/{id}`, `/artist/{id}`
            - SoundCloud: `/{user}/{track}`, `/track/{slug}`, `/album/{slug}`
            - Beatport: `/{slug}/{id}` (track/album)

            **Chinese Platforms:**
            - Kugou Music: `/{encode_id}.html`, `/{id}/` (track/album/artist/playlist)
            - QQ Music: `n/yqq/song/{mid}.html`, `n/yqq/album/{mid}.html`, `n/yqq/singer/{mid}.html`
