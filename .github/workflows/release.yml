name: Build Release Apk

on:
  workflow_dispatch:
    inputs:
      notes_en:
        description: "What's new"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Release Apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias kizzyfork \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kizzyfork -keypass kizzyfork \
            -dname "CN=Kizzy Fork, OU=Fork, O=Kizzy, L=NA, S=NA, C=NA"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check current JDK version
        id: current-jdk
        run: |
          CURRENT_VERSION=$(grep 'java-version:' .github/workflows/release.yml | grep -oP "'[0-9]+'" | tr -d "'")
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check latest JDK version (Eclipse Temurin)
        id: latest-jdk
        env:
          CURRENT_VERSION: ${{ steps.current-jdk.outputs.current }}
        run: |
          # Ask Adoptium for the most recent *released* feature version. This is a
          # GA release, unlike `tip_version`, which may be an early-access build
          # that actions/setup-java cannot install.
          LATEST_VERSION="$(curl -fsSL --retry 3 --retry-delay 2 \
            "https://api.adoptium.net/v3/info/available_releases" 2>/dev/null \
            | jq -r '.most_recent_feature_release // empty' 2>/dev/null)" || true

          if [ -z "$LATEST_VERSION" ]; then
            echo "::warning::Could not query the Adoptium API; keeping the configured JDK version."
            LATEST_VERSION="$CURRENT_VERSION"
          fi

          # Never downgrade if the API reports an older feature release.
          if [ -n "$CURRENT_VERSION" ] && [ -n "$LATEST_VERSION" ] \
              && [ "$LATEST_VERSION" -lt "$CURRENT_VERSION" ]; then
            LATEST_VERSION="$CURRENT_VERSION"
          fi

          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update JDK version in release.yml
        if: steps.current-jdk.outputs.current != steps.latest-jdk.outputs.latest
        run: |
          echo "Updating JDK from ${{ steps.current-jdk.outputs.current }} to ${{ steps.latest-jdk.outputs.latest }}"
          sed -i "s/java-version: '${{ steps.current-jdk.outputs.current }}'/java-version: '${{ steps.latest-jdk.outputs.latest }}'/" .github/workflows/release.yml
          sed -i 's/version-name = ".*"/version-name = "6.2-enhanced-${{ github.run_number }}"/' gradle/libs.versions.toml
          sed -i 's/version-code = ".*"/version-code = "${{ github.run_number }}"/' gradle/libs.versions.toml

      - name: Update app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          SRC="kizzy-fork-icon.png"
          convert "$SRC" -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$SRC" -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$SRC" -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$SRC" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$SRC" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "$SRC" -resize 108x108 app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 162x162 app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 216x216 app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 324x324 app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 432x432 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert -size 108x108 xc:"#BF1527" app/src/main/res/mipmap-mdpi/ic_launcher_background.png
          convert -size 162x162 xc:"#BF1527" app/src/main/res/mipmap-hdpi/ic_launcher_background.png
          convert -size 216x216 xc:"#BF1527" app/src/main/res/mipmap-xhdpi/ic_launcher_background.png
          convert -size 324x324 xc:"#BF1527" app/src/main/res/mipmap-xxhdpi/ic_launcher_background.png
          convert -size 432x432 xc:"#BF1527" app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          convert "$SRC" -resize 108x108 -colorspace gray app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 162x162 -colorspace gray app/src/main/res/mipmap-hdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 216x216 -colorspace gray app/src/main/res/mipmap-xhdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 324x324 -colorspace gray app/src/main/res/mipmap-xxhdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 432x432 -colorspace gray app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png

      - name: Assemble Release APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: kizzyfork
          KEY_ALIAS: kizzyfork
          KEY_PASSWORD: kizzyfork
        run: ./gradlew --max-workers=2 --no-daemon clean :data:kspReleaseKotlin :feature_rpc_base:kspReleaseKotlin :app:assembleRelease :app:bundleRelease

      - name: Analyze R8 Configuration
        run: ./gradlew :app:analyzeReleaseR8Config

      - name: Rename Base APK and App Bundle
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab

      - name: Generate Performance Reports
        run: |
          find app/build/outputs/mapping/release -name "mapping.txt" -o -name "usage.txt" 2>/dev/null | while read f; do
            echo "R8 Report: $f"
            cp "$f" "$GITHUB_WORKSPACE/build/reports/r8-$(basename "$f")" 2>/dev/null || true
          done
          ./gradlew :app:problemsRelease --no-daemon 2>/dev/null || true
          if [ -f "build/reports/problems/problems-report.html" ]; then
            cp build/reports/problems/problems-report.html build/reports/problems-release.html
          fi

      - name: Download bundletool
        run: |
          curl -L "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" -o "$RUNNER_TEMP/bundletool.jar"

      - name: Extract Universal & Per-ABI APKs from App Bundle
        run: |
          AAB="app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab"
          OUT_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/release"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" \
            --output="$RUNNER_TEMP/universal.apks" \
            --ks="$RUNNER_TEMP/release.keystore" \
            --ks-pass=pass:kizzyfork \
            --ks-key-alias=kizzyfork \
            --key-pass=pass:kizzyfork \
            --mode=universal
          unzip -o -q "$RUNNER_TEMP/universal.apks" "universal.apk" -d "$RUNNER_TEMP/out-universal"
          cp "$RUNNER_TEMP/out-universal/universal.apk" "$OUT_DIR/KizzyEnhanced-${{ github.run_number }}-universal.apk"
          for ABI in arm64-v8a x86_64; do
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
              --bundle="$AAB" \
              --output="$RUNNER_TEMP/${ABI}.apks" \
              --ks="$RUNNER_TEMP/release.keystore" \
              --ks-pass=pass:kizzyfork \
              --ks-key-alias=kizzyfork \
              --key-pass=pass:kizzyfork \
              --mode=universal
            unzip -o -q "$RUNNER_TEMP/${ABI}.apks" "universal.apk" -d "$RUNNER_TEMP/out-${ABI}"
            cp "$RUNNER_TEMP/out-${ABI}/universal.apk" "$OUT_DIR/KizzyEnhanced-${{ github.run_number }}-${ABI}.apk"
          done

      - name: Generate changelog
        run: chmod +x .github/scripts/generate-changelog.sh && .github/scripts/generate-changelog.sh

      - name: Generate Release Notes Body
        id: release_notes
        run: |
          # Build the download table inline (asset names & checksums) so nothing
          # depends on fragile cross-step multiline output interpolation.
          {
            echo "| File | Architecture / Type | Size | SHA-256 |"
            echo "| :--- | :--- | :--- | :--- |"
            RUN="${{ github.run_number }}"
            for FILE in \
              "app/build/outputs/apk/release/KizzyEnhanced-${RUN}-arm64-v8a.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${RUN}-x86_64.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${RUN}-universal.apk" \
              "app/build/outputs/bundle/release/KizzyEnhanced-${RUN}.aab"
            do
              [ -f "$FILE" ] || continue
              NAME=$(basename "$FILE")
              SIZE=$(du -h "$FILE" | cut -f1)
              HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
              case "$NAME" in
                *arm64-v8a*) ARCH="ARM64 (Recommended for modern phones)" ;;
                *x86_64*) ARCH="x86_64 (Emulators & Chromebooks)" ;;
                *universal*) ARCH="Universal (All architectures)" ;;
                *.aab*) ARCH="Android App Bundle (Play Store / bundletool)" ;;
              esac
              echo "| \`$NAME\` | $ARCH | $SIZE | \`$HASH\` |"
            done
          } > download-table.md

          {
            echo "## 🚀 Kizzy Enhanced ${{ github.run_number }}"
            echo ""
            # Use the user-provided notes when given, otherwise fall back to the
            # auto-generated changelog so the release body is never empty.
            NOTES="${{ github.event.inputs.notes_en }}"
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              cat changelog.md
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 📦 Downloads"
            echo ""
            cat download-table.md
            echo ""
            echo "---"
            echo ""
            echo "## 📊 R8 Configuration Analysis Report"
            echo ""
            echo "The R8 optimization analysis report has been generated and is available as a release asset below."
            echo "Download the HTML report to review R8 configuration analysis results including kept/removed classes, obfuscation stats, and optimization recommendations."
            echo ""
            echo "---"
            echo ""
            echo "## 📋 Changelog"
            echo ""
            cat changelog.md
            echo ""
            echo "---"
            echo ""
            echo "## 📊 Release Summary"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| Package | `com.my.kizzy.enhanced` |"
            echo "| Version | `6.2-enhanced-${{ github.run_number }}` |"
            echo "| Version Code | `${{ github.run_number }}` |"
            echo "| Base Project | Kizzy by dead8309 |"
            echo "| Base Commit | `5e494d94a2c05e4d56b75ac80aae51dba4436905` |"
            echo "| Full Feature List | [docs/RELEASE_FEATURES.md](docs/RELEASE_FEATURES.md) |"
            echo "| Compare to Base | [himyjan/Kizzy-Enhanced → master](https://github.com/himyjan/Kizzy-Enhanced/compare/ac7338da99ba2f4b95fa588d9b1cfd0ecfc4b919...master) |"
            echo ""
            echo "---"
            echo ""
            echo "## 📲 Installation"
            echo ""
            echo "1. Download **KizzyEnhanced-${{ github.run_number }}-arm64-v8a.apk** (or `universal.apk` if you are unsure of your device's CPU)."
            echo "2. Open the APK file on your Android device."
            echo "3. If prompted, allow \"Install from unknown sources\"."
            echo "4. If upgrading from an older build signed with a different key, uninstall the previous version first (export your RPC configs beforehand)."
            echo ""
            echo "---"
            echo ""
            echo "## 📖 Full Feature History"
            echo ""
            echo "See [docs/RELEASE_FEATURES.md](docs/RELEASE_FEATURES.md) for the complete list of features, bug fixes, and dependency changes."
            echo ""
          } > release-notes.md

      - name: Commit JDK version change
        if: steps.current-jdk.outputs.current != steps.latest-jdk.outputs.latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          git commit -m "chore: update JDK version to ${{ steps.latest-jdk.outputs.latest }}"
          git push

      - name: Upload All Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks-release
          path: app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: |
            build/reports/r8-*.txt
            build/reports/problems-release.html
            build/reports/build_reports_*/
            app/build/reports/r8/**
            app/build/reports/r8/r8-config-analyzer-release.pb
          retention-days: 30

      - name: Upload Changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md

      - name: Publish to Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: enhanced-${{ github.run_number }}
          name: Kizzy Enhanced ${{ github.run_number }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-arm64-v8a.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-x86_64.apk
            app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-universal.apk
            app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab
            app/build/reports/r8/**/*.html
            app/build/reports/r8/**/*.json
            app/build/reports/r8/**/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
