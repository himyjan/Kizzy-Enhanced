name: Build Release Apk

on:
  workflow_dispatch:
    inputs:
      notes_en:
        description: "What's new"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Release Apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: gradle

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias kizzyfork \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kizzyfork -keypass kizzyfork \
            -dname "CN=Kizzy Fork, OU=Fork, O=Kizzy, L=NA, S=NA, C=NA"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set version
        run: |
          sed -i 's/version-name = ".*"/version-name = "6.2-enhanced-${{ github.run_number }}"/' gradle/libs.versions.toml
          sed -i 's/version-code = ".*"/version-code = "${{ github.run_number }}"/' gradle/libs.versions.toml

      - name: Update app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          SRC="kizzy-fork-icon.png"
          convert "$SRC" -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$SRC" -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$SRC" -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$SRC" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$SRC" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "$SRC" -resize 108x108 app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 162x162 app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 216x216 app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 324x324 app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert "$SRC" -resize 432x432 app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          convert -size 108x108 xc:"#BF1527" app/src/main/res/mipmap-mdpi/ic_launcher_background.png
          convert -size 162x162 xc:"#BF1527" app/src/main/res/mipmap-hdpi/ic_launcher_background.png
          convert -size 216x216 xc:"#BF1527" app/src/main/res/mipmap-xhdpi/ic_launcher_background.png
          convert -size 324x324 xc:"#BF1527" app/src/main/res/mipmap-xxhdpi/ic_launcher_background.png
          convert -size 432x432 xc:"#BF1527" app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          convert "$SRC" -resize 108x108 -colorspace gray app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 162x162 -colorspace gray app/src/main/res/mipmap-hdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 216x216 -colorspace gray app/src/main/res/mipmap-xhdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 324x324 -colorspace gray app/src/main/res/mipmap-xxhdpi/ic_launcher_monochrome.png
          convert "$SRC" -resize 432x432 -colorspace gray app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png

      - name: Assemble Release APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: kizzyfork
          KEY_ALIAS: kizzyfork
          KEY_PASSWORD: kizzyfork
        run: ./gradlew clean :data:kspReleaseKotlin :feature_rpc_base:kspReleaseKotlin :app:assembleRelease :app:bundleRelease

      - name: Analyze R8 Configuration
        run: ./gradlew :app:analyzeReleaseR8Config

      - name: Rename Base APK and App Bundle
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-base.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab

      - name: Generate Performance Reports
        run: |
          # Generate R8 mapping report
          find app/build/outputs/mapping/release -name "mapping.txt" -o -name "usage.txt" 2>/dev/null | while read f; do
            echo "R8 Report: $f"
            cp "$f" "$GITHUB_WORKSPACE/build/reports/r8-$(basename "$f")" 2>/dev/null || true
          done

          # Generate Problems report
          ./gradlew :app:problemsRelease --no-daemon 2>/dev/null || true
          if [ -f "build/reports/problems/problems-report.html" ]; then
            cp build/reports/problems/problems-report.html build/reports/problems-release.html
          fi

          # Collect Compose compiler reports
          find . -path "*/build/compose_compiler/*" -name "*.html" -o -path "*/build/compose_compiler/*" -name "*.csv" 2>/dev/null | while read f; do
            echo "Compose Report: $f"
            dir=$(echo "$f" | sed 's|/build/compose_compiler/|_|g' | sed 's|build/_|build_reports_|')
            cp "$f" "$GITHUB_WORKSPACE/build/reports/$dir" 2>/dev/null || true
          done

          echo "Performance reports generated in build/reports/"

      - name: Download bundletool
        run: |
          curl -L "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" -o "$RUNNER_TEMP/bundletool.jar"

      - name: Extract Universal & Per-ABI APKs from App Bundle
        run: |
          AAB="app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab"
          OUT_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/release"

          # 1. Extract Universal APK
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" \
            --output="$RUNNER_TEMP/universal.apks" \
            --ks="$RUNNER_TEMP/release.keystore" \
            --ks-pass=pass:kizzyfork \
            --ks-key-alias=kizzyfork \
            --key-pass=pass:kizzyfork \
            --mode=universal
          unzip -o -q "$RUNNER_TEMP/universal.apks" "universal.apk" -d "$RUNNER_TEMP/out-universal"
          cp "$RUNNER_TEMP/out-universal/universal.apk" "$OUT_DIR/KizzyEnhanced-${{ github.run_number }}-universal.apk"

          # 2. Extract standalone APKs per ABI (arm64-v8a, x86_64 only - app excludes 32-bit)
          for ABI in arm64-v8a x86_64; do
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
              --bundle="$AAB" \
              --output="$RUNNER_TEMP/${ABI}.apks" \
              --ks="$RUNNER_TEMP/release.keystore" \
              --ks-pass=pass:kizzyfork \
              --ks-key-alias=kizzyfork \
              --key-pass=pass:kizzyfork \
              --mode=universal
            unzip -o -q "$RUNNER_TEMP/${ABI}.apks" "universal.apk" -d "$RUNNER_TEMP/out-${ABI}"
            cp "$RUNNER_TEMP/out-${ABI}/universal.apk" "$OUT_DIR/KizzyEnhanced-${{ github.run_number }}-${ABI}.apk"
          done

      - name: Upload All Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks-release
          path: app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: |
            build/reports/r8-*.txt
            build/reports/problems-release.html
            build/reports/build_reports_*/
            app/build/reports/r8/**
            app/build/reports/r8/r8-config-analyzer-release.pb
          retention-days: 30

      - name: Generate categorized git changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="-n 100"
          fi

          RAW_COMMITS=$(git log $RANGE --pretty=format:"%s (%h)" --no-merges | rg -iv '^(chore|ci|style|build|test)(\(.+\))?:' || true)

          FEATS=$(printf '%s\n' "$RAW_COMMITS" | rg -i '^feat(\(.+\))?:' | sed -E 's/^feat(\(([^)]+)\))?:\s*/- **\2**: /I; s/^\- \*\*\*\*: /- /' || true)
          FIXES=$(printf '%s\n' "$RAW_COMMITS" | rg -i '^fix(\(.+\))?:' | sed -E 's/^fix(\(([^)]+)\))?:\s*/- **\2**: /I; s/^\- \*\*\*\*: /- /' || true)
          PERFS=$(printf '%s\n' "$RAW_COMMITS" | rg -i '^(perf|refactor)(\(.+\))?:' | sed -E 's/^(perf|refactor)(\(([^)]+)\))?:\s*/- **\3**: /I; s/^\- \*\*\*\*: /- /' || true)
          OTHERS=$(printf '%s\n' "$RAW_COMMITS" | rg -iv '^(feat|fix|perf|refactor)(\(.+\))?:' | sed 's/^/- /' || true)

          {
            echo "body<<EOF"
            if [ -n "$FEATS" ]; then
              echo "### ✨ Features"
              printf '%s\n\n' "$FEATS"
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              printf '%s\n\n' "$FIXES"
            fi
            if [ -n "$PERFS" ]; then
              echo "### ⚡ Performance & Refactoring"
              printf '%s\n\n' "$PERFS"
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 📦 Other Changes"
              printf '%s\n\n' "$OTHERS"
            fi
            if [ -z "$RAW_COMMITS" ]; then
              echo "_No code changes recorded since last tag._"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release asset table & checksums
        id: assets
        run: |
          {
            echo "table<<EOF"
            echo "| File | Architecture / Type | Size | SHA-256 |"
            echo "| :--- | :--- | :--- | :--- |"
            for FILE in \
              "app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-arm64-v8a.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-x86_64.apk" \
              "app/build/outputs/apk/release/KizzyEnhanced-${{ github.run_number }}-universal.apk" \
              "app/build/outputs/bundle/release/KizzyEnhanced-${{ github.run_number }}.aab"
            do
              NAME=$(basename "$FILE")
              SIZE=$(du -h "$FILE" | cut -f1)
              HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
              case "$NAME" in
                *arm64-v8a*) ARCH="ARM64 (Recommended for modern phones)" ;;
                *x86_64*) ARCH="x86_64 (Emulators & Chromebooks)" ;;
                *universal*) ARCH="Universal (All architectures)" ;;
                *.aab*) ARCH="Android App Bundle (Play Store / bundletool)" ;;
              esac
              echo "| \`$NAME\` | $ARCH | $SIZE | \`$HASH\` |"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes Body
        id: release_notes
        run: |
          {
            echo "## 🚀 Kizzy Enhanced ${{ github.run_number }}"
            echo ""
            echo "${{ github.event.inputs.notes_en != '' && github.event.inputs.notes_en || 'No release notes provided.' }}"
            echo ""
            echo "---"
            echo ""
            echo "## 📦 Downloads"
            echo ""
            echo "| File | Architecture / Type | Size | SHA-256 |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "${{ steps.assets.outputs.table }}"
            echo ""
            echo "---"
            echo ""
            echo "## 📊 R8 Configuration Analysis Report"
            echo ""
            echo "The R8 optimization analysis report has been generated and is available as a release asset below."
            echo "Download the HTML report to review R8 configuration analysis results including kept/removed classes, obfuscation stats, and optimization recommendations."
            echo ""
            echo "---"
            echo ""
            echo "## 📋 Changelog"
            echo ""
            echo "${{ steps.changelog.outputs.body }}"
            echo ""
            echo "---"
            echo ""
            echo "## 📊 Release Summary"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| Package | `com.my.kizzy.enhanced` |"
            echo "| Version | `6.2-enhanced-${{ github.run_number }}` |"
            echo "| Version Code | `${{ github.run_number }}` |"
            echo "| Base Project | Kizzy by dead8309 |"
            echo "| Base Commit | `5e494d94a2c05e4d56b75ac80aae51dba4436905` |"
            echo "| Full Feature List | See the README |"
            echo "| Compare to Base | [himyjan/Kizzy-Enhanced → master](https://github.com/himyjan/Kizzy-Enhanced/compare/ac7338da99ba2f4b95fa588d9b1cfd0ecfc4b919...master) |"
            echo ""
            echo "---"
            echo ""
            echo "## 📲 Installation"
            echo ""
            echo "1. Download **KizzyEnhanced-${{ github.run_number }}-arm64-v8a.apk** (or `universal.apk` if you are unsure of your device's CPU)."
            echo "2. Open the APK file on your Android device."
            echo "3. If prompted, allow "Install from unknown sources"."
            echo "4. If upgrading from an older build signed with a different key, uninstall the previous version first (export your RPC configs beforehand)."
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🔧 Build & Dependency Changes (Click to expand)</summary>"
            echo ""
            echo "| Component | Base Commit | This Fork | Change Type |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| Gradle | 8.13.2 | 9.9.1 | Major upgrade |"
            echo "| AGP | 8.13.2 | 9.6.0-alpha03 | Major upgrade |"
            echo "| Kotlin | 2.1.20 | 2.4.21 | Major upgrade |"
            echo "| KSP | 2.1.20-1.0.31 | 2.3.13 | Major upgrade |"
            echo "| Compose BOM | 2025.06.01 | 2026.09.00 | ~1.5 years newer |"
            echo "| Ktor | 2.3.0 | 3.6.1 | Major upgrade |"
            echo "| Coil | 2.1.0 | 3.6.3 (Coil3) | Major rewrite |"
            echo "| Hilt | 2.56.2 | 2.60.1 | Minor upgrade |"
            echo "| Material | 1.12.0 | 1.14.0 | Minor upgrade |"
            echo ""
            echo "**Removed:** MMKV, Accompanist, BlankJ UtilCodex, CrashX, AndroidSVG, javax.inject  "
            echo "**Added:** Jetpack DataStore 1.3.0, Tink Android 1.24.0, Jetpack BaselineProfile 1.6.0-alpha01, Jetpack MacroBenchmark 1.6.0-alpha01, Coil 3.6.3, WorkManager 2.12.0, Hilt Work 1.4.0, Material3 Adaptive 1.4.0-alpha03  "
            echo "**Critical:** Coil 3 splits the HTTP fetcher — `coil-network-ktor3` was added; without it, remote images fail to load."
            echo "**HTTP Client:** CIO client replaced with OkHttp client via `ktor-client-okhttp` across all RPC services for better mobile reliability (connection pooling, HTTP/2 multiplexing, Wi-Fi/cellular handoff, robust SSL/TLS)."
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🎮 Console RPC → Custom RPC Merge</summary>"
            echo ""
            echo "**Before:** Separate Console RPC screen, home entry, and navigation route  "
            echo "**After:** Single Custom RPC screen with two tabs"
            echo ""
            echo "**Console RPC Tab:**"
            echo "- Platform: Desktop, Web, Android, iOS, Xbox, PlayStation, VR"
            echo "- Activity Type: Playing, Streaming, Listening, Watching, Competing"
            echo "- Status: Online, Idle, DND, Offline, Invisible"
            echo "- Enable Timestamps / Show Cover Art toggles"
            echo "- Button 1/2: Text + URL"
            echo "- Preset Games: Xbox, PlayStation, Nintendo, Desktop quick-select chips"
            echo ""
            echo "**Features:** Console presets with custom preset creation and deletion support"
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🔐 DataStore Migration (MMKV → Jetpack DataStore)</summary>"
            echo ""
            echo "**Before:** MMKV (C++ based, synchronous, no coroutine integration)  "
            echo "**After:** Jetpack DataStore Preferences 1.3.0"
            echo ""
            echo "**Architecture:** `MutableStateFlow<Map<String, Any?>>` mirror for synchronous reads; async writes on `Dispatchers.IO`.  "
            echo "**Typed Keys:** `stringPreferencesKey`, `intPreferencesKey`, `booleanPreferencesKey`, `floatPreferencesKey`, `longPreferencesKey`  "
            echo "**Remove:** Deletes key under all five typed keys  "
            echo "**Edit:** `MutablePreferences` receiver (`Preferences.() -> Unit`)"
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🔒 Tink AES-256-GCM Token Encryption</summary>"
            echo ""
            echo "**Sensitive keys encrypted:** `TOKEN`, `DISCORD_OAUTH_ACCESS_TOKEN`, `DISCORD_OAUTH_REFRESH_TOKEN`  "
            echo "**Key storage:** Android Keystore via `AndroidKeysetManager`  "
            echo "**Ciphertext:** `enc:` + Base64(NO_WRAP) — pre-existing plaintext tokens remain readable  "
            echo "**Fallback:** If keystore unavailable, falls back to plain text (user never locked out)"
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🔐 Discord OAuth2 Integration (New Feature)</summary>"
            echo ""
            echo "**Files added:** `DiscordAuth.kt`, `DiscordOAuthActivity.kt`, `DiscordUserLoginDialog.kt`, `DiscordOAuthRpcService.kt`  "
            echo "**OAuth2 flow:** User authorizes via Discord → app exchanges code for token → stored encrypted via Tink  "
            echo "**Per-user OAuth:** Users can use their own Discord account instead of bot token"
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>📱 Media RPC Activity Type Fix</summary>"
            echo ""
            echo "**Bug:** Global activity type setting did not take effect for known apps (YouTube Music, Spotify, etc.) because built-in catalog was checked before global fallback.  "
            echo "**Fix:** When user explicitly sets a global activity type (not "Auto"), built-in catalog and metadata detection are skipped; per-app overrides still win."
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🎨 Cover Art Settings (New Feature)</summary>"
            echo ""
            echo "**Global Toggle:** Hide Cover Art Images — when enabled, hides cover art from ALL RPC types (Media, Custom, Console, Experimental); Discord shows text only."
            echo ""
            echo "**Default Cover Art URLs:** Set default large and small cover art image URLs. When a notification has no cover art, the default image is used as fallback instead of Discord's default app icon."
            echo ""
            echo "**Applied to:** Media RPC, Custom RPC (Console tab), Experimental RPC."
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🔗 YouTube Music Link Fix</summary>"
            echo ""
            echo "**Bug:** YouTube Music activity link pointed to a search page URL (e.g. `youtube.com/results?search_query=...`) instead of the actual video.  "
            echo "**Fix:** `getMediaUrl()` now returns `null` when `extractYouTubeUrl()` returns null for YouTube apps, instead of falling back to `mediaSearchUrl()` which returns another search page. Discord now shows the direct `youtu.be/VIDEO_ID` link instead of a broken search page."
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🎮 Experimental RPC: Select All / Deselect All</summary>"
            echo ""
            echo "Two buttons added above the app list for bulk enabling/disabling all apps at once."
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🌍 i18n — All 87 Locale Files</summary>"
            echo ""
            echo "**0 English leftovers** across all locales  "
            echo "**0 cross-script contamination**  "
            echo "All 88 strings.xml files valid XML; `:app:mergeDebugResources` verified BUILD SUCCESSFUL  "
            echo "Brand names (Xbox, PlayStation, Nintendo, iOS, VR) intentionally identical across locales"
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🎮 Console RPC Game List with Search (New Feature)</summary>"
            echo ""
            echo "**Added to Custom RPC tab:** Console RPC now includes a preset game list with search functionality for quick console presence setup."
            echo ""
            echo "- **Game List:** Displays games from `ConsoleGameCatalog` with cover art and platform info"
            echo "- **Search:** Real-time filtering by game title (case-insensitive)"
            echo "- **Selection:** Tap a game to select it; check mark indicates selected game"
            echo "- **Quick Apply:** Selecting a game auto-applies Console RPC settings (platform, activity type, status, timestamps, cover art)"
            echo "- **Integration:** Works alongside existing Console Presets (built-in + custom) chips"
            echo "- **Files:** `ConsoleGameItem` composable + `applyConsoleGame()` in `CustomRpc.kt`, `games()` getter in `ConsoleGameCatalog`"
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🔧 Fix: MetadataResolver Class Name Mismatch</summary>"
            echo ""
            echo "**Bug:** `MediaResolver` class name did not match file name `MetadataResolver.kt`, causing build errors."
            echo ""
            echo "**Fix:** Renamed class `MediaResolver` → `MetadataResolver` in `MetadataResolver.kt`. Updated all references in `GetCurrentlyPlayingMedia.kt` and `GetCurrentPlayingMediaAll.kt` to use `metadataResolver: MetadataResolver`."
            echo ""
            echo "**Impact:** `:app:assembleDebug` compiles successfully."
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>📋 Fix: Last.fm Settings Relocation</summary>"
            echo ""
            echo "**Before:** Last.fm Scrobbling settings were on the Custom RPC screen."
            echo "**After:** Moved to Settings page (`RpcSettings.kt`) with a popup dialog for API credentials (API Key, API Secret) and enable/disable toggle."
            echo ""
            echo "**Details:**"
            echo "- Last.fm settings now live in the main Settings page instead of Custom RPC"
            echo "- Popup dialog for entering API Key and API Secret credentials"
            echo "- Enable/Disable Last.fm Scrobbling toggle"
            echo "- Added 10 Last.fm string resources across all 87 locale files"
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🎵 ListenBrainz Scrobbling (New Feature)</summary>"
            echo ""
            echo "**Added alternative scrobbling backend** for users who prefer ListenBrainz over Last.fm."
            echo ""
            echo "**Features:**"
            echo "- User token authentication via ListenBrainz API (https://api.listenbrainz.org/)"
            echo "- Scrobble tracks with artist, track, album, timestamp, duration, and song ID"
            echo "- Update Now Playing status for currently playing tracks"
            echo "- Token validation on save"
            echo "- Toggle for timestamps, cover art, and party size display"
            echo "- Token stored encrypted via Tink + Android Keystore"
            echo ""
            echo "**Files:** `ListenBrainz.kt` (new service), `RpcSettings.kt` (settings UI), `Prefs.kt` (preference keys), `strings.xml` (string resources)"
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🎨 Fix: "Hide Cover Art Images" Reactivity</summary>"
            echo ""
            echo "**Bug:** "Hide Cover Art Images" toggle did not react to DataStore preference changes."
            echo ""
            echo "**Fix:** Updated to use `collectAsState` pattern with `prefsMap` key for proper DataStore reactivity. The setting now correctly updates UI when the DataStore value changes."
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🔧 Fix: ConsolePresetEditor Icon Type Mismatch</summary>"
            echo ""
            echo "**Bug:** `ConsolePresetEditor.kt` referenced `Icons.Filled.Image` which doesn't exist in the material icons extended dependency, causing build failure in `ConsolePresetEditorDialog`."
            echo ""
            echo "**Fix:** Changed `Icons.Filled.Image` → `Icons.Outlined.Image` for cover art picker icons and added proper import for `androidx.compose.material.icons.outlined.Image`."
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "<details>"
            echo "<summary>🔧 Fix: Custom RPC Console Tab State References</summary>"
            echo ""
            echo "**Bug:** `CustomRpc.kt` `RpcTextFieldsColumn` referenced `state.consoleGames` instead of `uiState.consoleGames` for the Console RPC game list, causing unresolved reference compile error. `CustomScreenViewModel.kt` used `_uiState.update { ... }` which is not available on `MutableStateFlow` in this Kotlin version."
            echo ""
