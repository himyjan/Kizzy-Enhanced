name: Build Debug Apk

on: 
  workflow_dispatch:

# Natively replaces styfle/cancel-workflow-action to save runner minutes safely
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin' # 'adopt' is deprecated; temurin natively supports JDK 26
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/**.apk
