name: Update Dependency Versions

on:
  schedule:
    # Run every Monday at 00:00 UTC to check for new library versions
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-update
  cancel-in-progress: true

jobs:
  update-versions:
    name: Update dependency versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check current JDK version
        id: current-jdk
        run: |
          CURRENT_VERSION=$(grep 'java-version:' .github/workflows/update-versions.yml | grep -oP "'[0-9]+'" | tr -d "'")
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check latest JDK version (Eclipse Temurin)
        id: latest-jdk
        run: |
          LATEST_VERSION=$(curl -s "https://api.adoptium.net/v3/assets/latest/27/hotspot" | grep -oP '"version":\s*"[^"]+"' | head -1 | grep -oP '[0-9]+')
          if [ -z "$LATEST_VERSION" ]; then
            # Fallback: try major version endpoint
            LATEST_VERSION=$(curl -s "https://api.adoptium.net/v3/assets/info/versions" | grep -oP '[0-9]+' | sort -V | tail -1)
          fi
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update JDK version in workflow
        if: steps.current-jdk.outputs.current != steps.latest-jdk.outputs.latest
        run: |
          echo "Updating JDK from ${{ steps.current-jdk.outputs.current }} to ${{ steps.latest-jdk.outputs.latest }}"
          sed -i "s/java-version: '${{ steps.current-jdk.outputs.current }}'/java-version: '${{ steps.latest-jdk.outputs.latest }}'/" .github/workflows/update-versions.yml

      - name: Run versionCatalogUpdate
        run: ./gradlew versionCatalogUpdate --no-daemon

      - name: Check current Kotlin version
        id: current-kotlin
        run: |
          CURRENT_VERSION=$(grep '^kotlin = ' gradle/libs.versions.toml | grep -oP '"[^"]*"' | tr -d '"')
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check latest Kotlin version (including pre-release)
        id: latest-kotlin
        run: |
          LATEST_VERSION=$(curl -s "https://search.maven.org/solrsearch/select?q=g:org.jetbrains.kotlin%20AND%20a:kotlin-gradle-plugin&core=gav&rows=20&wt=json" | grep -oP '"v":"[^"]+"' | grep -oP '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?' | sort -V | tail -1)
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Kotlin version in libs.versions.toml
        if: steps.current-kotlin.outputs.current != steps.latest-kotlin.outputs.latest
        run: |
          echo "Updating Kotlin from ${{ steps.current-kotlin.outputs.current }} to ${{ steps.latest-kotlin.outputs.latest }}"
          sed -i 's/^kotlin = ".*"/kotlin = "${{ steps.latest-kotlin.outputs.latest }}"/' gradle/libs.versions.toml

      - name: Update kotlin-metadata-jvm version in build.gradle.kts
        if: steps.current-kotlin.outputs.current != steps.latest-kotlin.outputs.latest
        run: |
          echo "Updating kotlin-metadata-jvm from ${{ steps.current-kotlin.outputs.current }} to ${{ steps.latest-kotlin.outputs.latest }}"
          sed -i "s/kotlin-metadata-jvm:${{ steps.current-kotlin.outputs.current }}/kotlin-metadata-jvm:${{ steps.latest-kotlin.outputs.latest }}/" build.gradle.kts

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet gradle/wrapper/gradle-wrapper.properties libs.versions.toml .github/workflows/update-versions.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version updates
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.properties libs.versions.toml build.gradle.kts .github/workflows/update-versions.yml
          git commit -m "chore: update dependency versions via versionCatalogUpdate"
          git push
