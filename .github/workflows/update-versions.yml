name: Update Dependency Versions

on:
  schedule:
    # Run every Monday at 00:00 UTC to check for new library versions
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-update
  cancel-in-progress: true

jobs:
  update-versions:
    name: Update dependency versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 28
        uses: actions/setup-java@v6
        with:
          java-version: '28-ea'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check current JDK version
        id: current-jdk
        run: |
          CURRENT_VERSION=$(grep 'java-version:' .github/workflows/update-versions.yml | grep -oP "'[0-9]+'" | tr -d "'")
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check latest JDK version (Eclipse Temurin)
        id: latest-jdk
        env:
          CURRENT_VERSION: ${{ steps.current-jdk.outputs.current }}
        run: |
          # Ask Adoptium for the most recent *released* feature version. This is a
          # GA release, unlike `tip_version`, which may be an early-access build
          # that actions/setup-java cannot install.
          LATEST_VERSION="$(curl -fsSL --retry 3 --retry-delay 2 \
            "https://api.adoptium.net/v3/info/available_releases" 2>/dev/null \
            | jq -r '.most_recent_feature_release // empty' 2>/dev/null)" || true

          if [ -z "$LATEST_VERSION" ]; then
            echo "::warning::Could not query the Adoptium API; keeping the configured JDK version."
            LATEST_VERSION="$CURRENT_VERSION"
          fi

          # Never downgrade if the API reports an older feature release.
          if [ -n "$CURRENT_VERSION" ] && [ -n "$LATEST_VERSION" ] \
              && [ "$LATEST_VERSION" -lt "$CURRENT_VERSION" ]; then
            LATEST_VERSION="$CURRENT_VERSION"
          fi

          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update JDK version in workflow
        if: steps.current-jdk.outputs.current != steps.latest-jdk.outputs.latest
        run: |
          echo "Updating JDK from ${{ steps.current-jdk.outputs.current }} to ${{ steps.latest-jdk.outputs.latest }}"
          sed -i "s/java-version: '${{ steps.current-jdk.outputs.current }}'/java-version: '${{ steps.latest-jdk.outputs.latest }}'/" .github/workflows/update-versions.yml

      - name: Update sourceCompatibility/targetCompatibility/jvmToolchain to match JDK version
        if: steps.current-jdk.outputs.current != steps.latest-jdk.outputs.latest
        run: |
          NEW_VERSION=${{ steps.latest-jdk.outputs.latest }}
          echo "Updating sourceCompatibility/targetCompatibility/jvmToolchain to Java $NEW_VERSION"
          # KotlinAndroid.kt
          if [ -f "build-logic/convention/src/main/kotlin/kizzy/gradle/plugin/KotlinAndroid.kt" ]; then
            sed -i "s/sourceCompatibility = JavaVersion.VERSION_[0-9]*/sourceCompatibility = JavaVersion.VERSION_${NEW_VERSION}/" build-logic/convention/src/main/kotlin/kizzy/gradle/plugin/KotlinAndroid.kt
            sed -i "s/targetCompatibility = JavaVersion.VERSION_[0-9]*/targetCompatibility = JavaVersion.VERSION_${NEW_VERSION}/" build-logic/convention/src/main/kotlin/kizzy/gradle/plugin/KotlinAndroid.kt
            sed -i "s/jvmToolchain([0-9]*)/jvmToolchain(${NEW_VERSION})/" build-logic/convention/src/main/kotlin/kizzy/gradle/plugin/KotlinAndroid.kt
          fi
          # domain/build.gradle.kts
          if [ -f "domain/build.gradle.kts" ]; then
            sed -i "s/sourceCompatibility = JavaVersion.VERSION_[0-9]*/sourceCompatibility = JavaVersion.VERSION_${NEW_VERSION}/" domain/build.gradle.kts
            sed -i "s/targetCompatibility = JavaVersion.VERSION_[0-9]*/targetCompatibility = JavaVersion.VERSION_${NEW_VERSION}/" domain/build.gradle.kts
            sed -i "s/jvmToolchain([0-9]*)/jvmToolchain(${NEW_VERSION})/" domain/build.gradle.kts
          fi
          # macrobenchmark/build.gradle.kts
          if [ -f "macrobenchmark/build.gradle.kts" ]; then
            sed -i "s/sourceCompatibility = JavaVersion.VERSION_[0-9]*/sourceCompatibility = JavaVersion.VERSION_${NEW_VERSION}/" macrobenchmark/build.gradle.kts
            sed -i "s/targetCompatibility = JavaVersion.VERSION_[0-9]*/targetCompatibility = JavaVersion.VERSION_${NEW_VERSION}/" macrobenchmark/build.gradle.kts
            sed -i "s/jvmToolchain([0-9]*)/jvmToolchain(${NEW_VERSION})/" macrobenchmark/build.gradle.kts
          fi

      - name: Run versionCatalogUpdate
        run: ./gradlew versionCatalogUpdate --no-daemon || true

      - name: Check current Kotlin version
        id: current-kotlin
        run: |
          CURRENT_VERSION=$(grep '^kotlin = ' gradle/libs.versions.toml | grep -oP '"[^"]*"' | tr -d '"')
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check latest Kotlin version (stable)
        id: latest-kotlin
        env:
          CURRENT_VERSION: ${{ steps.current-kotlin.outputs.current }}
        run: |
          LATEST_VERSION=$(curl -fsSL "https://search.maven.org/solrsearch/select?q=g:org.jetbrains.kotlin%20AND%20a:kotlin-gradle-plugin&core=gav&rows=20&wt=json" 2>/dev/null \
            | grep -oP '"v":"[^"]+"' \
            | grep -oP '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?' \
            | grep -vE -- '-(m|dev|eap)' \
            | sort -V \
            | tail -1) || true
          if [ -z "$LATEST_VERSION" ]; then
            LATEST_VERSION="$CURRENT_VERSION"
          fi
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Kotlin version in libs.versions.toml
        if: steps.current-kotlin.outputs.current != steps.latest-kotlin.outputs.latest && steps.latest-kotlin.outputs.latest != ''
        run: |
          echo "Updating Kotlin from ${{ steps.current-kotlin.outputs.current }} to ${{ steps.latest-kotlin.outputs.latest }}"
          sed -i 's/^kotlin = ".*"/kotlin = "${{ steps.latest-kotlin.outputs.latest }}"/' gradle/libs.versions.toml

      - name: Update kotlin-metadata-jvm version in build.gradle.kts
        if: steps.current-kotlin.outputs.current != steps.latest-kotlin.outputs.latest && steps.latest-kotlin.outputs.latest != ''
        run: |
          echo "Updating kotlin-metadata-jvm from ${{ steps.current-kotlin.outputs.current }} to ${{ steps.latest-kotlin.outputs.latest }}"
          sed -i "s/kotlin-metadata-jvm:${{ steps.current-kotlin.outputs.current }}/kotlin-metadata-jvm:${{ steps.latest-kotlin.outputs.latest }}/" build.gradle.kts

      - name: Check current compileSdk version
        id: current-compilesdk
        run: |
          CURRENT_VERSION=$(grep -oP 'release\(\K[0-9]+' build-logic/convention/src/main/kotlin/kizzy/gradle/plugin/KotlinAndroid.kt 2>/dev/null || true)
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check latest compileSdk version (Android API level)
        id: latest-compilesdk
        env:
          CURRENT_VERSION: ${{ steps.current-compilesdk.outputs.current }}
        run: |
          LATEST_VERSION=$(curl -fsSL "https://developer.android.com/studio/releases" 2>/dev/null \
            | grep -oP 'API Level [0-9]+' \
            | grep -oP '[0-9]+' \
            | sort -V \
            | tail -1) || true
          if [ -z "$LATEST_VERSION" ]; then
            LATEST_VERSION="${CURRENT_VERSION:-36}"
          fi
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update compileSdk version in KotlinAndroid.kt
        if: steps.current-compilesdk.outputs.current != '' && steps.current-compilesdk.outputs.current != steps.latest-compilesdk.outputs.latest
        run: |
          echo "Updating compileSdk from ${{ steps.current-compilesdk.outputs.current }} to ${{ steps.latest-compilesdk.outputs.latest }}"
          sed -i "s/release(${{ steps.current-compilesdk.outputs.current }})/release(${{ steps.latest-compilesdk.outputs.latest }})/" build-logic/convention/src/main/kotlin/kizzy/gradle/plugin/KotlinAndroid.kt

      - name: Check for changes
        id: check-changes
        run: |
          FILES="gradle/wrapper/gradle-wrapper.properties gradle/libs.versions.toml build.gradle.kts build-logic/convention/src/main/kotlin/kizzy/gradle/plugin/KotlinAndroid.kt domain/build.gradle.kts macrobenchmark/build.gradle.kts .github/workflows/update-versions.yml"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard -- $FILES)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version updates
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.properties gradle/libs.versions.toml build.gradle.kts build-logic/convention/src/main/kotlin/kizzy/gradle/plugin/KotlinAndroid.kt domain/build.gradle.kts macrobenchmark/build.gradle.kts .github/workflows/update-versions.yml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update dependency versions via versionCatalogUpdate"
            git push origin "HEAD:${{ github.ref_name }}"
          fi