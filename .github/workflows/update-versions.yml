name: Update Dependency Versions

on:
  schedule:
    # Run every Monday at 00:00 UTC to check for new library versions
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-update
  cancel-in-progress: true

jobs:
  update-versions:
    name: Update dependency versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check current Gradle wrapper version
        id: current-gradle
        run: |
          CURRENT_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | grep -oP 'gradle-\K[0-9.]+')
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check latest Gradle version
        id: latest-gradle
        run: |
          LATEST_VERSION=$(curl -s https://services.gradle.org/versions/current | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Gradle wrapper
        if: steps.current-gradle.outputs.current != steps.latest-gradle.outputs.latest
        run: |
          echo "Updating Gradle from ${{ steps.current-gradle.outputs.current }} to ${{ steps.latest-gradle.outputs.latest }}"
          ./gradlew wrapper --gradle-version=${{ steps.latest-gradle.outputs.latest }} --no-daemon

      - name: Run versionCatalogUpdate
        run: ./gradlew versionCatalogUpdate --no-daemon

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet gradle/wrapper/gradle-wrapper.properties libs.versions.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version updates
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.properties libs.versions.toml
          git commit -m "chore: update dependency versions via versionCatalogUpdate"
          git push
