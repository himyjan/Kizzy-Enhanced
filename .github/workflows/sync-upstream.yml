name: Sync with original Kizzy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to sync to'
        required: true
        default: 'master'
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v7
        with:
          repository: himyjan/Kizzy-Enhanced
          ref: ${{ github.event.inputs.branch || 'master' }}
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dead8309/Kizzy.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Show upstream changes not in origin
        run: |
          echo "=== Upstream commits not in origin/${{ github.event.inputs.branch || 'master' }} ==="
          git log --oneline origin/${{ github.event.inputs.branch || 'master' }}..upstream/master | head -30 || true
          echo "=== Count ==="
          git rev-list --count origin/${{ github.event.inputs.branch || 'master' }}..upstream/master || true

      - name: Rebase onto upstream/master
        run: |
          set -e
          git rebase upstream/master

      - name: Push to origin
        run: |
          git push --force-with-lease origin ${{ github.event.inputs.branch || 'master' }}

      - name: Verify
        run: |
          git log --oneline -5
