name: Sync with original Kizzy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to sync to'
        required: true
        default: 'master'
      strategy:
        description: 'Conflict resolution strategy'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - ours
          - theirs
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          repository: himyjan/Kizzy-Enhanced
          ref: ${{ github.event.inputs.branch || 'master' }}
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dead8309/Kizzy.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for upstream changes
        id: check_changes
        run: |
          COMMIT_COUNT=$(git rev-list --count origin/${{ github.event.inputs.branch || 'master' }}..upstream/master)
          echo "Upstream commits not in origin: $COMMIT_COUNT"
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo "=== Upstream commits ==="
            git log --oneline origin/${{ github.event.inputs.branch || 'master' }}..upstream/master | head -30
          fi

      - name: Rebase onto upstream/master
        if: steps.check_changes.outputs.commit_count > 0
        run: |
          set -e
          STRATEGY="${{ github.event.inputs.strategy }}"
          if [ "$STRATEGY" = "theirs" ]; then
            git rebase -X theirs upstream/master
          elif [ "$STRATEGY" = "ours" ]; then
            git rebase -X ours upstream/master
          else
            git rebase upstream/master
          fi

      - name: Push to origin
        if: steps.check_changes.outputs.commit_count > 0
        run: |
          git push --force-with-lease origin ${{ github.event.inputs.branch || 'master' }}

      - name: Verify
        run: |
          echo "=== Current HEAD ==="
          git log --oneline -5
